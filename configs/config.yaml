# Global configuration for the local music MIR recommender (Phase 1 MVP).
# All thresholds/weights are config-driven; nothing core should be hard-coded.

audio:
  sample_rate: 44100
  mono: true
  # Bounded analysis window (seconds) per track: 0 = analyse the whole file.
  # Features are still estimated values; window is centred on the loudest region
  # so chorus/structure stay representative. Full duration is always preserved.
  max_analysis_seconds: 45
  # Normalized intermediate format written under data/normalized_audio
  normalized_dir: data/normalized_audio
  # Accepted source extensions
  extensions: [".mp3", ".wav"]

paths:
  sqlite_dir: data/sqlite
  db_file: data/sqlite/music.db
  faiss_dir: data/faiss
  logs_dir: logs

# Sequence similarity budget. Levenshtein is O(n*m), so an unbounded per-frame
# melody sequence (real tracks hit ~2700 tokens) made song->song take 266s on a
# 93-track library. Sequences are quantised to note/chord events and then capped
# by even subsampling; contour shape survives, per-frame fidelity is not kept.
features:
  max_sequence_tokens: 120
  # Seconds of the harmonic stem fed to pyin. This is the single biggest cost in
  # extraction (~29s of a ~43s track), so it is the knob to turn for throughput.
  max_pitch_seconds: 30
  # pyin's frame-to-frame error on real recordings is ~0.3-0.5 semitone, i.e. the
  # same size as one semitone. Measured on the real library, 1-semitone buckets made
  # 83-90% of "note changes" pure rounding flip-flop; a 2-semitone bucket plus a
  # 5-frame median drops that to 0 while keeping pitch range within 1 semitone.
  # Consequence: genuine stepwise motion under 2 semitones is merged into one event -
  # we do not claim resolution the tracker does not have.
  melody_note_quantise_semitones: 2
  # Median-filter width in pyin frames before note detection; 0/1 disables.
  melody_pitch_smooth_frames: 5

embedding:
  # Phase 1 placeholder embedder: librosa statistical features -> PCA.
  # Swap by implementing the AudioEmbedder interface (see embedding/base.py).
  backend: librosa_pca
  pca_components: 24
  # Persist fitted PCA + feature scaler for reproducibility.
  model_store: data/faiss/embedding_pipeline.joblib

vector_store:
  index_file: faiss_index.bin
  track_ids_file: track_ids.json
  embedding_model_file: embedding_model.txt
  embedding_dim_file: embedding_dimension.txt

retrieval:
  faiss_top_k: 200

# Dynamic Feed / interest model (spec 35-41, 65-66). All tunable, nothing hard-coded.
feed:
  # Blend of interest scopes: CurrentInterest = l1*short + l2*medium + l3*long  (l1>l2>l3)
  scope_lambda: { short: 0.6, medium: 0.3, long: 0.1 }
  # Time windows (seconds) used to bucket events into scopes.
  scope_windows: { short: 3600, medium: 86400, long: 2592000 }
  # Per-event base weight (sign matters) and decay constant tau (seconds).
  events:
    like:     { base_weight:  1.00, tau: 604800 }
    complete: { base_weight:  0.60, tau: 259200 }
    replay:   { base_weight:  0.80, tau: 259200 }
    play:     { base_weight:  0.30, tau: 86400 }
    partial:  { base_weight:  0.10, tau: 21600 }
    skip:     { base_weight: -0.50, tau: 21600 }
    dislike:  { base_weight: -1.20, tau: 604800 }
    impression: { base_weight: 0.0, tau: 3600 }
  # Candidate ranking term weights (spec 39): preference + similarity + novelty + diversity.
  ranking_weights: { preference: 0.55, similarity: 0.20, novelty: 0.15, diversity: 0.10 }
  recent_history_window: 20     # exclude/dampen the last N played tracks
  cold_start:
    strategy: diverse           # no behaviour yet -> diverse sample, NOT external popularity
    exploration: 0.3

# Category system (spec 30-32, 63-64): presets live in configs/categories.yaml.
# This is the one remaining knob panel for it: ranking engine, unsupervised
# discovery, free-text parsing, plus `extra` for user-added categories.
category_system:
  engine:
    # A category "has real backing" when at least this many library tracks land within
    # support_max_distance of its target percentiles. Small libraries must not look
    # confident: below `min_support` the result carries low_support=true.
    support_max_distance: 0.25
    support_min_share: 0.05
    support_min_count: 5
    # Near-duplicate suppression so a 30-item category list is not the same song family.
    dedupe: true
    dedupe_lambda: 0.80          # relevance vs. redundancy
    dedupe_max_similarity: 0.97  # above this cosine to an already-picked track: dropped
  discovery:
    enabled: true
    include_in_listing: true
    k_min: 4
    k_max: 12
    min_cluster_size: 4          # absolute floor...
    min_cluster_share: 0.04      # ...and as a share of the library, whichever is larger
    name_min_deviation: 0.15     # a dimension must sit this far from the library middle
    name_max_terms: 3            # max dimensions woven into one auto name
    # Missing percentiles (e.g. every vocal dimension on an instrumental) are imputed to
    # the library middle, never to an extreme: "we did not measure it" must not read as
    # "it is low".
    neutral_impute: 0.5
    presence_split: 0.25
    tag_min_coverage: 0.60       # only name a cluster after a tag if 60% of members carry it
    tag_min_purity: 0.70         # ...and 70% of those agree on the same value
    random_state: 0
  text:
    target_high: 0.85
    target_low: 0.15
    keep_first: true
  extra: []

logging:
  level: INFO
  pipeline_log: logs/pipeline.log
  errors_log: logs/errors.log

feature_version: "v1"
